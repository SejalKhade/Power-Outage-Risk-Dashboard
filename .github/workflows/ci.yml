name: CI — Power Outage Risk Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify pipeline files exist
        run: |
          python -c "
          import os
          files = [
              'src/preprocess.py',
              'src/features.py',
              'src/train.py',
              'src/utils.py',
              'api/main.py',
              'Dockerfile',
          ]
          for f in files:
              assert os.path.exists(f), f'Missing: {f}'
              print(f'OK: {f}')
          print('All pipeline files verified.')
          "

      - name: Test FastAPI imports
        run: |
          python -c "
          from fastapi import FastAPI
          from pydantic import BaseModel
          import joblib, pandas, numpy
          print('All API dependencies import successfully')
          "

      - name: Lint check
        run: |
          pip install flake8
          flake8 src/ api/ --max-line-length=120 --ignore=E501,W503,E402 --count